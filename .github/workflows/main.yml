name: Build YepGram

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Swiftgram/Telegram-iOS commit to build on (the patch was checked against this one)
        default: e3a392272b182dbf975d4ac5fc33b40a5954d749
      runner:
        description: Runner label (needs Xcode 27)
        default: xcode-27

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360

    steps:
      - name: Check out this repository (patch + workflow)
        uses: actions/checkout@v4
        with:
          path: yepgram

      - name: Check secrets
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "::error::Add TELEGRAM_API_ID and TELEGRAM_API_HASH in Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf ~/Library/Android /usr/local/share/dotnet /usr/local/lib/node_modules ~/.dotnet ~/.ghcup || true
          xcrun simctl runtime delete all 2>/dev/null || true
          df -h /

      - name: Select Xcode 27
        run: |
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 27 on this runner. Installed:"; ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Clone Swiftgram with submodules
        run: |
          # Source paths end up in the binary, so build from a stable location.
          sudo mkdir -p /Users/Shared/telegram-ios
          sudo chown "$USER" /Users/Shared/telegram-ios
          cd /Users/Shared/telegram-ios
          git init -q
          git remote add origin https://github.com/Swiftgram/Telegram-iOS.git
          git fetch -q --depth 1 origin "${{ inputs.upstream_ref }}"
          git checkout -q FETCH_HEAD
          git submodule update --init --recursive --depth 1 --jobs 8
          git log -1 --format='%H %cd'

      - name: Apply YepGram patch
        run: python3 "$GITHUB_WORKSPACE/yepgram/patch/apply.py" /Users/Shared/telegram-ios

      - name: Write build configuration
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          # bundle_id and team_id must match build-system/fake-codesigning; Sideloadly re-signs
          # the app with your own Apple ID anyway.
          python3 - <<'EOF'
          import json, os
          config = {
              "sg_config": "",
              "bundle_id": "ph.telegra.Telegraph",
              "api_id": os.environ["API_ID"],
              "api_hash": os.environ["API_HASH"],
              "team_id": "C67CF9S4VU",
              "app_center_id": "0",
              "is_internal_build": "false",
              "is_appstore_build": "false",
              "appstore_id": "0",
              "app_specific_url_scheme": "tg",
              "premium_iap_product_id": "",
              "enable_siri": False,
              "enable_icloud": False,
          }
          with open("/Users/Shared/yepgram-configuration.json", "w") as f:
              json.dump(config, f)
          EOF

      - name: Build
        run: |
          cd /Users/Shared/telegram-ios
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot=/private/var/tmp/_bazel_yepgram \
            build \
            --continueOnError \
            --configurationPath=/Users/Shared/yepgram-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber=${{ github.run_number }} \
            --outputBuildArtifactsPath=/Users/Shared/artifacts

      - name: Rename IPA
        run: |
          ls -la /Users/Shared/artifacts
          mv /Users/Shared/artifacts/Swiftgram.ipa /Users/Shared/artifacts/YepGram.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: YepGram-ipa
          path: /Users/Shared/artifacts/YepGram.ipa
          if-no-files-found: error

      - name: Disk usage after build
        if: always()
        run: df -h /
